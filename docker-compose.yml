# Production-like local / demo stack (image copies source; no bind-mount).
#
# Default SQLite (data on named volume):
#   docker compose up --build
#   bash scripts/compose.sh up --build   # also forwards this machine's pip index
#
# Image names are official (python:3.12-slim, postgres:16-alpine) so this
# machine's Docker registry-mirrors apply. Do not pin a country-specific
# registry in this file.
#
# Optional Postgres:
#   DATABASE_URL=postgresql+psycopg2://cino:cino@db:5432/cino_hr \
#     bash scripts/compose.sh --profile postgres up --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    image: cino-hr-api:local
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:-demo-key}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/cino_hr.db}
      FILE_LOCAL_DIR: ${FILE_LOCAL_DIR:-/data/files}
    volumes:
      - hr_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  # Enable with: bash scripts/compose.sh --profile postgres up --build
  # Also set DATABASE_URL=postgresql+psycopg2://cino:cino@db:5432/cino_hr
  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cino
      POSTGRES_PASSWORD: cino
      POSTGRES_DB: cino_hr
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cino -d cino_hr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hr_data:
  pg_data:
